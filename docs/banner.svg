<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="wakeme: your AI agent waits on a long job; wakeme wakes it when the job finishes, fails or hangs. Without wakeme, a hung job keeps the agent waiting for hours. With wakeme, the agent is woken shortly after the job goes silent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcb6b"/>
      <stop offset="0.55" stop-color="#f6a35b"/>
      <stop offset="1" stop-color="#81c995"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#3a2a2e"/>
      <rect width="3" height="8" fill="#5c3438"/>
    </pattern>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .lane { font-size: 15px; font-weight: 600; fill: #e6edf3; }
      .row { font-size: 12px; fill: #8b949e; }
      .bar { font-size: 12px; font-weight: 600; }
      .note { font-size: 12px; fill: #9da7b3; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>

  <!-- logo: an alarm clock -->
  <g transform="translate(118 92)">
    <circle cx="-26" cy="-30" r="13" fill="#ffcb6b"/>
    <circle cx="26" cy="-30" r="13" fill="#ffcb6b"/>
    <line x1="-22" y1="34" x2="-30" y2="46" stroke="#ffcb6b" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="34" x2="30" y2="46" stroke="#ffcb6b" stroke-width="6" stroke-linecap="round"/>
    <circle r="40" fill="#0d1117" stroke="#ffcb6b" stroke-width="7"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="17" y2="10" stroke="#81c995" stroke-width="5" stroke-linecap="round"/>
    <circle r="5" fill="#e6edf3"/>
  </g>

  <text x="200" y="104" font-size="64" font-weight="700" fill="url(#title)">wakeme</text>
  <text x="202" y="144" font-size="22" fill="#9da7b3">Your AI agent waits on a long job. wakeme wakes it up</text>
  <text x="202" y="174" font-size="22" fill="#9da7b3">when the job finishes, fails, runs too long, or <tspan fill="#ffcb6b" font-weight="600">hangs</tspan>.</text>

  <!-- timeline panel -->
  <g transform="translate(80 204)">
    <rect width="1120" height="190" rx="12" fill="#161b22" stroke="#30363d"/>

    <!-- the moment the job hangs -->
    <line x1="470" y1="18" x2="470" y2="176" stroke="#f28b82" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="470" y="14" class="note" text-anchor="middle" style="fill:#f28b82">job hangs</text>

    <!-- lane 1: without wakeme -->
    <text x="24" y="50" class="lane">Without wakeme</text>
    <text x="196" y="38" class="row" text-anchor="end">job</text>
    <text x="196" y="66" class="row" text-anchor="end">agent</text>
    <rect x="210" y="24" width="260" height="20" rx="5" fill="#81c995"/>
    <text x="340" y="38" class="bar" text-anchor="middle" fill="#0d1117">running</text>
    <rect x="470" y="24" width="620" height="20" rx="5" fill="url(#hatch)"/>
    <text x="780" y="38" class="bar" text-anchor="middle" fill="#f28b82">hung: no output, CPU idle, never exits</text>
    <rect x="210" y="52" width="880" height="20" rx="5" fill="#2d333b"/>
    <text x="650" y="66" class="bar" text-anchor="middle" fill="#9da7b3">waiting for the background command to exit … still waiting hours later</text>

    <!-- lane 2: with wakeme -->
    <text x="24" y="132" class="lane">With wakeme</text>
    <text x="196" y="120" class="row" text-anchor="end">job</text>
    <text x="196" y="148" class="row" text-anchor="end">agent</text>
    <rect x="210" y="106" width="260" height="20" rx="5" fill="#81c995"/>
    <text x="340" y="120" class="bar" text-anchor="middle" fill="#0d1117">running</text>
    <rect x="470" y="106" width="150" height="20" rx="5" fill="url(#hatch)"/>
    <text x="545" y="120" class="bar" text-anchor="middle" fill="#f28b82">silent for --idle</text>
    <rect x="210" y="134" width="410" height="20" rx="5" fill="#2d333b"/>
    <text x="415" y="148" class="bar" text-anchor="middle" fill="#9da7b3">waiting, no polling</text>

    <!-- wake-up -->
    <line x1="620" y1="96" x2="620" y2="176" stroke="#ffcb6b" stroke-width="2"/>
    <g transform="translate(620 92)">
      <circle r="11" fill="#ffcb6b"/>
      <circle cx="-8" cy="-9" r="4" fill="#ffcb6b"/>
      <circle cx="8" cy="-9" r="4" fill="#ffcb6b"/>
      <line x1="0" y1="0" x2="0" y2="-6" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="4" y2="3" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="626" y="106" width="464" height="20" rx="5" fill="#ffcb6b"/>
    <text x="858" y="120" class="bar" text-anchor="middle" fill="#0d1117">WAKEME train STALLED · exit 125 · job left running</text>
    <rect x="626" y="134" width="464" height="20" rx="5" fill="#8ab4f8"/>
    <text x="858" y="148" class="bar" text-anchor="middle" fill="#0d1117">woken: reads the last log lines, attaches again or stops the job</text>

    <text x="1096" y="182" class="note" text-anchor="end" style="fill:#6e7681">illustration</text>
  </g>
</svg>
